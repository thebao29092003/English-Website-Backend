
services:
  # 1. SQL Server 2022 Database Service (Dev)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: english-website-sqlserver-dev
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_dev_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - english-network-dev

  # 2. .NET 8 Backend Service (Dev)
  backend:
    image: ghcr.io/thebao29092003/english-website-backend:dev
    container_name: english-website-backend-dev
    restart: unless-stopped
    # dev lắng nghe port 8081
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # Biến môi trường không nhạy cảm (Đã có giá trị sẵn)
      - AllowedHosts=*
      - CorsOrigins=http://localhost:5173,https://stephenie-unreversed-christina.ngrok-free.dev,https://english-website-frontend-rust.vercel.app,https://english-website-git-dev-tran-the-bao.vercel.app,https://engsteps.io.vn,https://dev.engsteps.io.vn
      - AppSettings__Issuer=English-website
      - AppSettings__Audience=English-website-audience
      - Smtp__Server=smtp.gmail.com
      - Smtp__Port=587
      - WebHook__AssemblyAI__Url=https://api-dev.engsteps.io.vn/api/assembly/webhook
      - WebHook__BackendPython__Url=http://backend:8080/api/backend-python/phonetic-webhook
      - BackendPython__BaseUrl=http://python-backend:8000/api/v1
      - Otel__Protocol=http/protobuf
      - Otel__ServiceName=english-website-backend
      - Otel__serviceVersion=1.0.0
      - Cloudfare__VerifyUrl=https://challenges.cloudflare.com/turnstile/v0/siteverify
    # Dùng Docker Secrets cho toàn bộ các Key rỗng ("") / nhạy cảm
    secrets:
      - ConnectionStrings__englistWebsite
      - AppSettings__SecretKey
      - Smtp__SenderEmail
      - Smtp__SenderPassword
      - AdminSettings__Email
      - Cloud__Cloudinary
      - Cloudfare__TurnStileKey
      - AI__DeepSeekApiKey
      - AI__AssemblyAIKey
      - WebHook__AssemblyAI__Token
      - WebHook__BackendPython__Token
      - Otel__Endpoint
      - Otel__Headers
      - Otel__SeriLogAuthHeader
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      sqlserver:
        condition: service_healthy
      python-backend:
        condition: service_healthy
    networks:
      - english-network-dev

  # 3. Python FastAPI ML Service (Dev)
  python-backend:
    image: ghcr.io/thebao29092003/english-website-python:dev
    container_name: english-website-python-dev
    restart: unless-stopped
    # Chỉ giao tiếp nội bộ qua english-network-dev, không expose port ra máy thật
    # (Nếu muốn debug trực tiếp từ máy thật, có thể mở lại comment 8000:8000)
    # ports:
    #   - "8000:8000"
    environment:
      - WEB_HOOK_DOT_NET=${WEB_HOOK_DOT_NET}
      - NLTK=${NLTK}
      - MODAL_ENVIRONMENT=${MODAL_ENVIRONMENT}
      - MODAL_TOKEN_ID=${MODAL_TOKEN_ID}
      - MODAL_TOKEN_SECRET=${MODAL_TOKEN_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - english-network-dev

# Đăng ký danh sách Docker Secrets ánh xạ tới các tệp .txt trong ./secrets/
secrets:
  mssql_sa_password:
    file: ./secrets/mssql_sa_password.txt
  ConnectionStrings__englistWebsite:
    file: ./secrets/db_connection_string.txt
  AppSettings__SecretKey:
    file: ./secrets/jwt_secret.txt
  Smtp__SenderEmail:
    file: ./secrets/smtp_email.txt
  Smtp__SenderPassword:
    file: ./secrets/smtp_password.txt
  AdminSettings__Email:
    file: ./secrets/admin_email.txt
  Cloud__Cloudinary:
    file: ./secrets/cloudinary_secret.txt
  Cloudfare__TurnStileKey:
    file: ./secrets/turnstile_key.txt
  AI__DeepSeekApiKey:
    file: ./secrets/deepseek_api_key.txt
  AI__AssemblyAIKey:
    file: ./secrets/assembly_ai_key.txt
  WebHook__AssemblyAI__Token:
    file: ./secrets/webhook_assemblyai_token.txt
  WebHook__BackendPython__Token:
    file: ./secrets/webhook_backendpython_token.txt
  Otel__Endpoint:
    file: ./secrets/otel_endpoint.txt
  Otel__Headers:
    file: ./secrets/otel_headers.txt
  Otel__SeriLogAuthHeader:
    file: ./secrets/otel_serilog_auth_header.txt

volumes:
  sqlserver_dev_data:
    driver: local

networks:
  english-network-dev:
    driver: bridge
